write:
  name: Write parameter
  description: Writes a parameter to the Luxtronik heatpump.
  fields:
    config_entry_id:
      name: Heatpump
      description: The heatpump to write to. Without it, the parameter is written to the first loaded heatpump.
      required: false
      selector:
        config_entry:
          integration: luxtronik2
    parameter:
      name: Parameter
      description: ID of the parameter to write.
      required: true
      example: "ID_Ba_Hz_akt"
      selector:
        text:
    value:
      name: Value
      description: Value to set the parameter to, for example an operating mode or a temperature.
      required: true
      example: "Automatic"
      selector:
        text:
