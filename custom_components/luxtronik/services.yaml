write:
  name: Write parameter
  description: Writes a parameter to the Luxtronik heatpump.
  fields:
    parameter:
      name: Parameter
      description: ID of the parameter to write.
      required: true
      example: "ID_Ba_Hz_akt"
      selector:
        text:
    value:
      name: Value
      description: Value to set the parameter to, for example an operating mode or a temperature.
      required: true
      example: "Automatic"
      selector:
        text:
