rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules:
    status: done
    comment: The coordinator is in coordinator.py and the shared base entity in entity.py.
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name:
    status: done
    comment: Entities configured through the legacy YAML platforms keep their configured name.
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: >-
      The write action validates its input before it schedules the debounced write. A
      debounced write (the write action, number entities) fails after the call returned,
      so that error is logged.
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: todo
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The heatpump controller does not require authentication.
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: todo
  inject-websession:
    status: done
    comment: The firmware update entity uses the aiohttp session of Home Assistant. The heatpump library uses a plain socket.
  strict-typing: todo
